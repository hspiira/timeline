name: CI

# Every failure this repository hit recently would have been caught here:
# a forked migration chain, a migration that could not run on an empty database,
# tests that had never executed, and a write path that returned 500 for every
# request. Nothing enforced any of it before.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timeline
          POSTGRES_PASSWORD: timeline
          POSTGRES_DB: timeline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Values are throwaway; the app refuses to start without them.
      DATABASE_URL: postgresql+asyncpg://timeline:timeline@localhost:5432/timeline_test
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
      ENCRYPTION_SALT: ci-encryption-salt-16
      REDIS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Application imports
        # Catches the stale __init__ exports that broke startup twice.
        run: uv run python -c "from app.main import app; print('app loads')"

      - name: Migration chain has exactly one head
        # A second head makes "alembic upgrade head" unresolvable, which is how this
        # repository became undeployable without anyone noticing.
        run: |
          HEADS=$(uv run alembic heads | grep -c '(head)')
          echo "alembic heads: $HEADS"
          uv run alembic heads
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Expected exactly one migration head, found $HEADS. Merge them."
            exit 1
          fi

      - name: Migrations run on an empty database
        # The only check that proves a fresh deployment can work. Two separate bugs
        # (a duplicated column, a duplicated index) were caught only by trying this.
        run: uv run alembic upgrade head

      - name: Migrations are reversible
        # Downgrading the most recent revision and re-applying it catches a downgrade
        # that was never written or never worked.
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

      - name: Tests pass without a database too
        # The documented "make test" path, which contributors use locally.
        env:
          DATABASE_URL: postgresql+asyncpg://unused:unused@127.0.0.1:1/unused
        run: uv run pytest -m "not requires_db" -q

      - name: Tenant isolation is actually verified
        # These tests skip themselves when the connected role bypasses row-level
        # security, and the role CI connects as is a superuser, so for their whole
        # existence they reported green without running. The fixture now provisions a
        # restricted role and connects as it. Treat a skip here as a failure: the one
        # property this system must not get wrong cannot be allowed to go unchecked.
        run: |
          set +e
          OUT=$(uv run pytest tests/integration/test_tenant_isolation.py -q -rs 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Tenant isolation tests failed."
            exit 1
          fi
          if echo "$OUT" | grep -qE '[0-9]+ skipped'; then
            echo "::error::Tenant isolation tests skipped instead of running."
            exit 1
          fi

      - name: Lint must not get worse
        # Ratcheted rather than all-or-nothing: there is existing debt, and a check
        # that fails on day one gets ignored. Lower the baseline as it is paid down.
        run: |
          BASELINE=$(cat ci/flake8-baseline.txt)
          COUNT=$(uv run flake8 app tests scripts --count 2>/dev/null | tail -1)
          echo "flake8 issues: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            uv run flake8 app tests scripts || true
            echo "::error::Lint issues rose from $BASELINE to $COUNT."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Lint improved to $COUNT. Update ci/flake8-baseline.txt to lock it in."
          fi

      - name: Cyclomatic complexity must not get worse
        # Same ratchet as the lint step. max-complexity is 5 in pyproject.toml, which
        # is strict on purpose: the point is to notice branching as it arrives, not to
        # force a refactor of every function already over the line. See ci/README.md.
        run: |
          BASELINE=$(cat ci/complexity-baseline.txt)
          COUNT=$(uv run ruff check --select C901 app tests scripts --output-format concise 2>/dev/null | grep -c 'C901' || true)
          echo "functions over max-complexity: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            uv run ruff check --select C901 app tests scripts || true
            echo "::error::Complex functions rose from $BASELINE to $COUNT."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Complexity improved to $COUNT. Update ci/complexity-baseline.txt to lock it in."
          fi

      - name: Known-vulnerable dependencies
        continue-on-error: true
        run: uv run pip-audit
