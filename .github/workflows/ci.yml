name: CI

# The build script is a bare `vite build` with no type checking, so a broken JSX
# expression reached main and nothing noticed until someone ran the dev server. Type
# errors referencing schemas the API had renamed sat there just as quietly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches what resolves locally. The lockfile is version 9.0, which pnpm 9,
          # 10 and 11 all read, but pinning avoids CI and local drifting apart.
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        # Build, then the ratcheted type and lint checks. All three live in
        # scripts/verify.mjs so the same command reproduces CI locally; it emits
        # ::error:: and ::notice:: annotations when it detects Actions.
        #
        # Build is absolute: a failure means the app does not run at all. Types
        # and lint are ratcheted against ci/*-baseline.txt because the repo
        # carries existing debt. Once a baseline reaches zero, drop the ratchet
        # in the script and fail on any finding.
        #
        # No test step yet, on purpose. There are no test files, and `vitest run
        # --passWithNoTests` still exits 1 here: it reports "Tests closed
        # successfully" then hangs for ten seconds on "something prevents Vite
        # server from exiting" and fails. A step that always fails teaches
        # everyone to ignore CI. Add this to verify.mjs with the first real test,
        # and expect to sort out that shutdown warning (usually a devtools or
        # plugin handle left open) at the same time.
        run: pnpm verify
