[project]
name = "timeline"
version = "0.1.0"
description = "Multi-tenant event sourcing system with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "fastapi[standard]>=0.128.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    # Database & ORM
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31.0",
    # Caching
    "redis>=7.1.0",
    # Authentication & Security
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "nh3>=0.2.0",
    "pyjwt>=2.13.0",
    # OAuth / Google APIs (e.g. Gmail in email extra)
    "google-auth>=2.45.0",
    # Utilities & storage (local backend used by document upload)
    "aiofiles>=25.1.0",
    "aioimaplib>=2.0.1",
    "cuid2>=2.0.1",
    "jsonschema>=4.25.1",
    "slowapi>=0.1.9",
    "scalar-fastapi>=1.0.0",
    # Database Migrations
    "alembic>=1.14.0",
    # Observability (OTLP only; Jaeger ingests OTLP on 4317)
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "opentelemetry-instrumentation-redis>=0.60b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1",
    "greenlet>=3.3.1",
    "python-pptx>=1.0.2",
    "rfc3161ng>=2.1.3",
]

[project.optional-dependencies]
email = [
    "google-api-python-client>=2.187.0",
    "msal>=1.34.0",
]
storage = [
    "boto3>=1.42.19",
]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # Code Quality
    "ruff>=0.14.0",
    "black>=26.3.1",
    "isort>=7.0.0",
    "autoflake>=2.3.1",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    # Security
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_db: mark test as requiring PostgreSQL (skip when DATABASE_URL unset)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Alembic revisions are generated and rewritten by autogenerate.
exclude = ["alembic/", "app/infrastructure/persistence/migrations/"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "migrations", "app/infrastructure/persistence/migrations"]

[tool.ruff.lint]
# C901 only for now. The repository carries lint debt that flake8 already
# ratchets (see ci/README.md); turning on ruff's default rule set here would
# duplicate those findings under different codes.
select = ["C901"]

[tool.ruff.lint.mccabe]
# Deliberately strict. Nothing at or below 5 branches needs a second look, so
# anything above it is worth a glance even when the verdict is "fine as is".
# The CI ratchet in ci/complexity-baseline.txt keeps the existing backlog from
# failing the build while it is paid down.
max-complexity = 5
