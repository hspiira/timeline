<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      Carried over from the route head() this replaced, minus script-src 'unsafe-inline'.
      That exemption existed only for Start's inline hydration bootstrap, which this
      build no longer emits. Set the real policy as a response header on whatever
      serves these files; a meta tag cannot carry frame-ancestors and is the weaker form.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' %VITE_API_URL% ws: wss:"
    />
  </head>
  <body class="h-full overflow-x-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
